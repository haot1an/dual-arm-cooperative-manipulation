# 静态构型避障 A/B：同一物体参考、QP 和物理接触，只改变零空间开关。
name: nullspace
description: 保持长板位姿，双臂通过关节零空间主动远离肘部障碍
model: models/scene_nullspace.xml

object: {body: plate, geom: plate_geom}
grasps:
  left:  {site: grasp_L, weld: weld_L, finger_opening: 0.011}
  right: {site: grasp_R, weld: weld_R, finger_opening: 0.011}
constraints:
  - {name: weld_L, type: rigid, body1: left_hand, body2: plate, relative_dof: 0}
  - {name: weld_R, type: rigid, body1: right_hand, body2: plate, relative_dof: 0}
obstacles:
  pairs:
    - [left_arm, right_arm]
    - [left_arm, post_L]
    - [right_arm, post_R]
    - [object, post_L]
    - [object, post_R]
waypoints:
  - {name: grasp, pos: [0.0, -0.45, 0.876], rpy_deg: [0, 0, 0]}
cameras: [cam_iso, cam_front, cam_demo]
q_init:
  left:  [0.821260, 0.609877, -0.273083, -2.244896, -1.206165, 1.611843, -1.123575]
  right: [-0.871891, 0.618396, 0.323701, -2.246911, 1.187778, 1.636811, -0.439111]

overrides:
  simulation: {contacts: true, duration: 12}
  disturbances: []
  object_trajectory: {type: hold}
  controller:
    type: qp_coop
    coop:
      # 姿态保持为弱目标，避障优先调整肘部；阻尼限制构型调整速度。
      nullspace_kp: 0.5
      nullspace_kd: 6.0
      nullspace:
        enabled: true
        ramp_time: 2.0
        activation_distance: 0.12
        avoidance_gain: 400.0
    torque_qp:
      collision_threads: 0
