name: slot_avoid
description: 双臂共同搬运长板越过障碍墙，滚转 90° 后插入窄槽
model: models/scene_slot_avoid.xml

object:
  body: plate
  geom: plate_geom

grasps:
  # contact_depth：接触模式下抓取点再向板内 15 mm（TCP 距端面 25 mm，指垫完整压在板上，手掌离端面 12 mm）
  left:  {site: grasp_L, weld: weld_L, finger_opening: 0.011, contact_depth: 0.015}
  right: {site: grasp_R, weld: weld_R, finger_opening: 0.011, contact_depth: 0.015}

constraints:
  - {name: weld_L, type: rigid, body1: left_hand, body2: plate, relative_dof: 0}
  - {name: weld_R, type: rigid, body1: right_hand, body2: plate, relative_dof: 0}

obstacles:
  pairs:
    - [left_arm, right_arm]
    - [left_arm, table_top]
    - [right_arm, table_top]
    - [left_arm, barrier]
    - [right_arm, barrier]
    - [object, barrier]
    - [left_arm, slot_frame]
    - [right_arm, slot_frame]
    - [left_arm, riser]
    - [right_arm, riser]
    - {a: object, b: slot_frame, safe_distance: 0.001}
    - {a: object, b: riser, safe_distance: 0.001}

# 原始任务轨迹不包含越墙航点；reference governor 根据实时距离自主插入抬升偏置。
waypoints:
  - {name: grasp,       pos: [0.0, -0.4500, 0.8760], rpy_deg: [0, 0, 0]}
  - {name: lifted,      pos: [0.0, -0.4500, 1.1310], rpy_deg: [0, 0, 0]}
  - {name: rolled,      pos: [0.0, -0.4500, 1.1310], rpy_deg: [-90, 0, 0]}
  - {name: pre_insert,  pos: [0.0, -0.6500, 1.1310], rpy_deg: [-90, 0, 0]}
  - {name: inserted,    pos: [0.0, -0.6500, 1.0510], rpy_deg: [-90, 0, 0]}

cameras: [cam_iso, cam_front]

slot:
  width: 0.04
  depth: 0.05
  mouth_z: 1.0000
  center_y: -0.6500
  roll_axis: [1, 0, 0]
  roll_deg: -90

q_init:
  left:  [0.821260, 0.609877, -0.273083, -2.244896, -1.206165, 1.611843, -1.123575]
  right: [-0.871891, 0.618396, 0.323701, -2.246911, 1.187778, 1.636811, -0.439111]

overrides:
  object_trajectory:
    waypoints:
      v_max: 0.08
      a_max: 0.20
  controller:
    torque_qp:
      collision_max_approach_speed: 0.30
      admm_max_iterations: 80
      reference_governor:
        enabled: true
        obstacle_group: object~barrier
        trigger_distance: 0.08
        release_distance: 0.03
        avoidance_offset: 0.15
        offset_speed: 0.12
        preferred_direction: [0.0, 0.0, 1.0]
        # cbf：连续偏移 + 虚拟时间的 CBF 参考滤波（docs/cbf_reference_governor.md）；
        # state_machine：原 NORMAL→LIFT→CROSS→DESCEND（上面 trigger/release/avoidance_offset 等只用于它）
        mode: cbf
